name: CD - Deploy jimicdk Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jimicdk-frontend
  FRONTEND_IMAGE_NAME: jimicdk-frontend

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      frontend_image: ${{ steps.vars.outputs.frontend_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set image names
        id: vars
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_PUBLIC_BASE=${{ secrets.VITE_API_PUBLIC_BASE }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_ASSET_BASE=${{ secrets.VITE_ASSET_BASE }}
          tags: |
            ${{ steps.vars.outputs.frontend_image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.frontend_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Frontend to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      DEPLOY_FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}:${{ needs.build-and-push.outputs.tag }}
      GHCR_USER: ${{ github.repository_owner }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          envs: GH_ACCESS_TOKEN,DEPLOY_FRONTEND_IMAGE,GHCR_USER
          script: |
            set -euo pipefail
            cd ~/opt/project || cd /root/opt/project || cd opt/project
            pwd
            if [ -z "${GH_ACCESS_TOKEN:-}" ]; then
              echo "Missing GH_ACCESS_TOKEN secret (need PAT with read:packages)"
              exit 1
            fi
            GHCR_USER=$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GH_ACCESS_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export JIMICDK_FRONTEND_IMAGE="$DEPLOY_FRONTEND_IMAGE"
            echo "JIMICDK_FRONTEND_IMAGE=$JIMICDK_FRONTEND_IMAGE"
            docker compose pull jimicdk_frontend
            docker compose up -d --no-build --force-recreate --remove-orphans jimicdk_frontend
            docker compose ps jimicdk_frontend
            docker image prune -f

